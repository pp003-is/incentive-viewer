<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026年7月稼働 メディカル事業部インセン・手当</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💴</text></svg>">
<style>
  :root{
    --ink:#1f2733;
    --sub:#6b7684;
    --line:#e2e6ec;
    --bg:#f7f8fa;
    --card:#ffffff;
    --accent:#2f6f5e;
    --accent-soft:#eaf3f0;
    --zero:#b6bcc5;
    --pena:#b4453c;
    --pena-bg:#fdf3f2;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:28px 20px 60px;
    font-family:"Meiryo UI","Meiryo",sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:13px; line-height:1.6;
  }
  .wrap{max-width:1040px;margin:0 auto}
  h1{font-size:19px;margin:0 0 4px;font-weight:700;letter-spacing:.02em}
  .lead{color:var(--sub);font-size:12px;margin:0 0 20px}

  .total{
    display:flex;gap:26px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:14px 18px;margin-bottom:20px;
  }
  .total div span{display:block;font-size:11px;color:var(--sub)}
  .total div strong{font-size:17px;font-variant-numeric:tabular-nums}
  .total div.p strong{color:var(--pena)}

  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  select,button{
    font-family:inherit;font-size:12px;padding:6px 10px;
    border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);
    cursor:pointer;
  }
  button:hover{background:var(--accent-soft);border-color:var(--accent)}
  button.on{background:var(--pena-bg);border-color:var(--pena);color:var(--pena)}
  .bar label{font-size:12px;color:var(--sub)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:7px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{
    font-size:11px;color:var(--sub);font-weight:400;background:#fafbfc;
    cursor:pointer;user-select:none;position:sticky;top:0;z-index:1;
  }
  th:hover{color:var(--accent)}
  th .arw{opacity:.35;margin-left:3px}
  th.on{color:var(--accent);font-weight:700}
  th.on .arw{opacity:1}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#f9fbfa}
  tbody tr.pena{background:var(--pena-bg)}
  tbody tr.pena:hover{background:#fbebe9}
  tbody td:first-child{width:1%;color:var(--sub);font-variant-numeric:tabular-nums}
  .zero{color:var(--zero)}
  .cut{color:var(--pena)}
  .rate{color:var(--pena);font-weight:700}
  .tag{display:inline-block;padding:1px 7px;border-radius:10px;background:#f0f2f5;color:var(--sub);font-size:11px}
  tfoot td{font-weight:700;background:#fafbfc;border-bottom:none}
  @media(max-width:640px){
    body{padding:20px 10px 40px}
    th,td{padding:6px 8px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>2026年7月稼働　メディカル事業部インセン・手当</h1>
  <p class="lead">営業歩合はペナルティ減額後の着地額。お弁当・臨時手当は含みません。見出しをクリックで並べ替え。</p>

  <div class="total">
    <div><span>減額前合計</span><strong id="t0">–</strong></div>
    <div class="p"><span>減額金額</span><strong id="t4">–</strong></div>
    <div><span>営業歩合（着地）</span><strong id="t1">–</strong></div>
    <div><span>休日出勤</span><strong id="t2">–</strong></div>
    <div><span>人数</span><strong id="t3">–</strong></div>
  </div>

  <div class="bar">
    <label for="emp">雇用</label>
    <select id="emp"><option value="">すべて</option></select>
    <label for="job">職種</label>
    <select id="job"><option value="">すべて</option></select>
    <button id="only">ペナありのみ</button>
    <button id="csv">CSVをダウンロード</button>
    <button id="copy">表をコピー</button>
  </div>

  <div class="card">
    <table>
      <thead><tr>
        <th style="cursor:default"></th>
        <th data-k="0">インセン名前<span class="arw">↕</span></th>
        <th data-k="1">雇用<span class="arw">↕</span></th>
        <th data-k="2">職種<span class="arw">↕</span></th>
        <th data-k="3" class="num">減額前合計<span class="arw">↕</span></th>
        <th data-k="4" class="num">ペナ率<span class="arw">↕</span></th>
        <th data-k="5" class="num">減額金額<span class="arw">↕</span></th>
        <th data-k="6" class="num">営業歩合<span class="arw">↕</span></th>
        <th data-k="7" class="num">休日出勤<span class="arw">↕</span></th>
      </tr></thead>
      <tbody id="body"></tbody>
      <tfoot><tr>
        <td></td><td colspan="3">合計</td>
        <td class="num" id="s0"></td><td></td>
        <td class="num cut" id="s4"></td>
        <td class="num" id="s1"></td><td class="num" id="s2"></td>
      </tr></tfoot>
    </table>
  </div>
</div>

<script>
// [名前, 雇用, 職種, 減額前合計, ペナ率(%), 減額金額, 営業歩合(着地), 休日出勤]
const RAW = [
["杉浦 秀樹","宜興会","CC",136023,20,27205,108818,0],
["渕邊 翔里","宜興会","CC",122029,0,0,122029,0],
["林﨑 健","宜興会","CC",289967,0,0,289967,0],
["高田 順之","宜興会","CC",140663,0,0,140663,0],
["下﨑 哲史","宜興会","アトムCS",70906,0,0,70906,30000],
["土崎 貴宏","宜興会","アトムCS",0,0,0,0,30000],
["朝長 泰志","宜興会","CC",175588,0,0,175588,0],
["堤 亮介","宜興会","アトムCS",4976,0,0,4976,0],
["曲 泰史","宜興会","アトムCS",26594,50,13297,13297,0],
["前園 浩一","宜興会","痩身CS",1193190,0,0,1193190,0],
["堀 崇弘","インターシフト","アトムCS",117551,0,0,117551,30000],
["根市 裕久","インターシフト","CC",100503,20,20101,80402,0],
["丸子 修人","インターシフト","CC",157653,0,0,157653,0],
["高橋 悠","インターシフト","CC",47860,0,0,47860,0],
["福井 啓介","インターシフト","CC",123609,0,0,123609,0],
["笹渕 了大","インターシフト","CC",206666,0,0,206666,0],
["井上 悠輝","インターシフト","CC",9750,0,0,9750,0],
["中山 達也","インターシフト","CC",377407,0,0,377407,0],
["清水 優太","インターシフト","痩身CS",279822,0,0,279822,252500],
["時尾 信一郎","インターシフト","痩身CS",1336990,0,0,1336990,0],
["椎名 諒","インターシフト","CC",90552,20,18110,72442,0],
["高橋 龍巳","インターシフト","痩身CS",92602,0,0,92602,252500],
["木村 航大","インターシフト","痩身CS",0,20,0,0,240000],
["細川 賢人","インターシフト","痩身CS",1298463,0,0,1298463,0],
["吉岡 七尋","インターシフト","痩身CS",452452,0,0,452452,105000],
["小澤 亮太","インターシフト","CA",0,0,0,0,90000],
["石川 光雅","インターシフト","CA",104542,0,0,104542,0],
["宮本 康平","インターシフト","CA",102719,0,0,102719,0],
["石橋 陽輝","インターシフト","CC",168684,0,0,168684,0],
["淺井 美沙緒","インターシフト","CA",47637,0,0,47637,0],
["梁本 哲志","インターシフト","CC",68344,0,0,68344,0],
["守屋 一馬","インターシフト","CC",129424,0,0,129424,0],
["佐藤 愛","インターシフト","CC",45635,0,0,45635,0],
["中道 佑哉","インターシフト","アトムCS",247033,0,0,247033,0],
["御園 優","インターシフト","CC",400000,0,0,400000,0],
["笹島 瞳子","インターシフト","CS",572809,0,0,572809,25000],
["宮森 優紀","インターシフト","CS",292631,20,58526,234105,37500],
["丸橋 綾子","インターシフト","CC",0,0,0,0,0],
["富山 昂平","WrapMarketing","CC",33524,0,0,33524,0],
["稲垣 英寿","WrapMarketing","アトムCS",42441,0,0,42441,0],
["萌崇 拓見","WrapMarketing","CC",216580,0,0,216580,0],
["藤野 清風","WrapMarketing","CC",124304,0,0,124304,0],
["山内 陵","WrapMarketing","CC",252395,0,0,252395,0],
["松岡 丈真","WrapMarketing","CC",121376,20,24275,97101,0],
["藤本 康平","WrapMarketing","アトムCS",113142,0,0,113142,0],
["佐々木 龍一","WrapMarketing","CS",127313,20,25463,101850,0],
["日高 智憲","WrapMarketing","痩身CS",250976,0,0,250976,0],
["五反田 真一","WrapMarketing","痩身CS",10232,0,0,10232,117500],
["田中 直樹","WrapMarketing","CC",198245,20,39649,158596,0],
["蓬莱 庸太","WrapMarketing","痩身CS",52703,20,10541,42162,68750],
["渕上 賢人","WrapMarketing","CS",0,0,0,0,105000],
["椎野 碧斗","WrapMarketing","CC",167772,0,0,167772,0],
["奥長 謙太郎","WrapMarketing","CS",33071,0,0,33071,0],
["神林 宏企","WrapMarketing","CC",40111,20,8022,32089,0],
["美濃 翔太","WrapMarketing","CS",15732,0,0,15732,111250],
["田井 康義","WrapMarketing","CS",40180,0,0,40180,0],
["渡邊 すみれ","WrapMarketing","CC",0,20,0,0,0],
["岡田 荘太","WrapMarketing","CS",13294,0,0,13294,62500],
["伊藤 真也","WrapMarketing","CS",0,0,0,0,0],
["小石原 拓馬","WrapMarketing","CC",0,0,0,0,0],
["澤井 拓也","WrapMarketing","CS",0,0,0,0,25000]
];

const yen = n => "¥" + n.toLocaleString("ja-JP");
let sortKey = null, asc = true, onlyPena = false;

function current(){
  let rows = RAW.filter(r =>
    (!emp.value || r[1]===emp.value) &&
    (!job.value || r[2]===job.value) &&
    (!onlyPena || r[4] > 0)
  );
  if(sortKey !== null){
    const k = sortKey;
    rows = rows.slice().sort((a,b)=>{
      const x=a[k], y=b[k];
      const c = (typeof x==="number") ? x-y : String(x).localeCompare(String(y),"ja");
      return asc ? c : -c;
    });
  }
  return rows;
}

function render(){
  const rows = current();
  body.innerHTML = rows.map((r,i)=>`<tr class="${r[4]>0?"pena":""}">
    <td>${i+1}</td>
    <td>${r[0]}</td>
    <td>${r[1]}</td>
    <td><span class="tag">${r[2]}</span></td>
    <td class="num${r[3]===0?" zero":""}">${yen(r[3])}</td>
    <td class="num">${r[4]>0?`<span class="rate">${r[4]}%</span>`:`<span class="zero">–</span>`}</td>
    <td class="num">${r[5]>0?`<span class="cut">−${yen(r[5])}</span>`:`<span class="zero">–</span>`}</td>
    <td class="num${r[6]===0?" zero":""}">${yen(r[6])}</td>
    <td class="num${r[7]===0?" zero":""}">${yen(r[7])}</td>
  </tr>`).join("") || `<tr><td colspan="9" style="color:var(--sub)">該当なし</td></tr>`;

  const sum = k => rows.reduce((s,r)=>s+r[k],0);
  const b4=sum(3), cut=sum(5), a=sum(6), h=sum(7);
  s0.textContent=yen(b4); s4.textContent="−"+yen(cut); s1.textContent=yen(a); s2.textContent=yen(h);
  t0.textContent=yen(b4); t4.textContent="−"+yen(cut); t1.textContent=yen(a); t2.textContent=yen(h);
  t3.textContent=rows.length+"名";

  document.querySelectorAll("th[data-k]").forEach(th=>{
    const on = Number(th.dataset.k) === sortKey;
    th.classList.toggle("on", on);
    th.querySelector(".arw").textContent = on ? (asc ? "↑" : "↓") : "↕";
  });
}

document.querySelectorAll("th[data-k]").forEach(th=>{
  th.addEventListener("click", ()=>{
    const k = Number(th.dataset.k);
    if(sortKey === k){ asc = !asc; } else { sortKey = k; asc = true; }
    render();
  });
});

[["emp",1],["job",2]].forEach(([id,idx])=>{
  const el = document.getElementById(id);
  [...new Set(RAW.map(r=>r[idx]))].forEach(v=>{
    const o=document.createElement("option"); o.value=o.textContent=v; el.appendChild(o);
  });
  el.addEventListener("change", render);
});

only.addEventListener("click", ()=>{
  onlyPena = !onlyPena;
  only.classList.toggle("on", onlyPena);
  only.textContent = onlyPena ? "全員を表示" : "ペナありのみ";
  render();
});

function flat(){
  return [["インセン名前","雇用","職種","減額前合計","ペナ率","減額金額","営業歩合","休日出勤"],
    ...current().map(r=>[r[0],r[1],r[2],r[3],r[4]?r[4]+"%":"",r[5],r[6],r[7]])];
}
csv.addEventListener("click",()=>{
  const text="\uFEFF"+flat().map(r=>r.join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));
  a.download="2026年7月稼働_メディカル事業部インセン手当.csv"; a.click();
});
copy.addEventListener("click",async e=>{
  await navigator.clipboard.writeText(flat().map(r=>r.join("\t")).join("\n"));
  const b=e.target, t=b.textContent; b.textContent="コピーしました"; setTimeout(()=>b.textContent=t,1400);
});

render();
</script>
</body>
</html>
